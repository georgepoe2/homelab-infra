---
# Pre-RKE2 node baseline.
#
# Most node configuration already lives in the golden image. This playbook does
# two things: it ASSERTS that the image's promises survived cloning, and it
# applies the per-node preparation that depends on the CNI choice (ADR-002:
# Cilium), which the template could not know about when it was built.
- name: Baseline for RKE2 nodes
  hosts: rke2_servers:rke2_agents
  become: true
  gather_facts: true

  tasks:

    # ---- Verify the golden image, before building anything on top of it ----

    - name: Gather service state
      ansible.builtin.service_facts:

    - name: SELinux is enforcing
      ansible.builtin.assert:
        that:
          - ansible_selinux.status == "enabled"
          - ansible_selinux.config_mode == "enforcing"
        fail_msg: "SELinux is not enforcing - RKE2's SELinux policy expects it"

    - name: Swap is off
      ansible.builtin.assert:
        that: ansible_swaptotal_mb == 0
        fail_msg: "Swap is present - the kubelet refuses to start with swap enabled"

    - name: firewalld is not running
      ansible.builtin.assert:
        that: >
          'firewalld.service' not in services
          or services['firewalld.service'].state != 'running'
        fail_msg: "firewalld is running - it conflicts with the CNI's iptables/eBPF rules"

    - name: Kernel is new enough for Cilium kube-proxy replacement
      ansible.builtin.assert:
        that: ansible_kernel is version('5.8', '>=')
        fail_msg: "Kernel {{ ansible_kernel }} is below 5.8; do not enable kubeProxyReplacement"

    - name: Count the nameservers in /etc/resolv.conf
      ansible.builtin.command:
        cmd: grep -c '^nameserver' /etc/resolv.conf
      register: ns_count
      changed_when: false
      failed_when: false
      # Read-only, so it must still run under --check; without this Ansible
      # skips it and the assertion below reads an undefined variable.
      check_mode: false

    - name: Exactly one nameserver, and it is the internal one
      ansible.builtin.assert:
        that: ns_count.stdout | int == 1
        fail_msg: >
          {{ ns_count.stdout }} nameservers in /etc/resolv.conf. The gateway
          returns NODATA for internal names and glibc may treat that as final.

    # ---- The nodes are IPv4-only; say so once ----

    # rpm.rancher.io resolves to both A and AAAA records. These VMs have no
    # global IPv6 address, so when librepo happened to pick the AAAA it failed
    # with "No route to host" - a real routing error for a destination dnf
    # should never have tried. Which address family it picks is not stable, so
    # the same install succeeded on the control planes and failed on a worker.
    # glibc's built-in RFC 3484 table ranks native IPv6 (40) above
    # IPv4-mapped (10), so anything using getaddrinfo - curl, dnf, librepo,
    # python - prefers a AAAA even on a host with no global IPv6 address.
    # Raising the IPv4 precedence flips that for every program at once,
    # rather than patching each caller as it fails.
    - name: glibc prefers IPv4
      ansible.builtin.lineinfile:
        path: /etc/gai.conf
        regexp: '^precedence ::ffff:0:0/96'
        line: 'precedence ::ffff:0:0/96  100'
        create: true
        owner: root
        group: root
        mode: "0644"

    - name: dnf resolves IPv4 only
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        insertafter: '^\[main\]'
        regexp: '^ip_resolve='
        line: 'ip_resolve=4'
        owner: root
        group: root
        mode: "0644"

    # Every problem on this build so far has turned out to be DNS. Not having
    # dig on the machines has cost more than the 2MB the package weighs.
    - name: DNS tools are available for diagnosis
      ansible.builtin.dnf:
        name: bind-utils
        state: present

    # ---- CNI-dependent preparation: Cilium ----

    - name: NetworkManager leaves Cilium's interfaces alone
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/rke2-cilium.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Cilium creates and owns these. NetworkManager managing them causes
          # intermittent pod networking failures that look like anything else.
          # RKE2 documents this for Canal only; the Cilium equivalent is ours.
          [keyfile]
          unmanaged-devices=interface-name:cilium_*;interface-name:lxc*;interface-name:cilium_host;interface-name:cilium_net;interface-name:cilium_vxlan;interface-name:cilium_geneve;interface-name:cilium_wg0
      notify: Reload NetworkManager

    - name: The Canal NetworkManager exclusion is not needed with Cilium
      ansible.builtin.file:
        path: /etc/NetworkManager/conf.d/rke2-canal.conf
        state: absent
      notify: Reload NetworkManager

  handlers:
    - name: Reload NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: reloaded

# ---- Storage clients: workers only ----
#
# Pods that use NAS storage only run on workers (control planes carry
# CriticalAddonsOnly:NoExecute), so only workers need the NFS and iSCSI clients.
- name: Storage and VPN prerequisites on workers
  hosts: rke2_agents
  become: true
  gather_facts: false
  # One node at a time, like the agent play. Installing packages isn't the image
  # pull that hung the NICs, but there's no reason to find out.
  serial: 1

  tasks:

    - name: NFS and iSCSI client packages are installed
      ansible.builtin.dnf:
        name:
          - nfs-utils
          - iscsi-initiator-utils
        state: present

    # The initiator name is how the Synology knows which node is asking for a
    # LUN. It must be unique per node. The package is already in the golden
    # image, so a name generated there would be shared by every clone.
    # Deriving it from the hostname makes it unique and keeps it the same
    # across a rebuild, so any host rules on the NAS keep matching.
    - name: iSCSI initiator name is derived from the hostname
      ansible.builtin.copy:
        dest: /etc/iscsi/initiatorname.iscsi
        owner: root
        group: root
        mode: "0644"
        content: |
          InitiatorName=iqn.2026-10.internal.rookery:{{ inventory_hostname }}
      notify: Restart iscsid
      # /etc/iscsi comes with the package, so under --check it doesn't exist yet.
      ignore_errors: "{{ ansible_check_mode }}"

    # Gluetun (the VPN sidecar) needs /dev/net/tun. Rocky ships the tun module
    # but doesn't load it until something asks the kernel for it, and a
    # container can't load modules. Without this, Gluetun fails with
    # "open /dev/net/tun: no such device".
    - name: tun module loads at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/tun.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          tun

    - name: tun module is loaded now
      ansible.builtin.command:
        cmd: modprobe tun
      changed_when: false

    # Check the property, not the exit code above. Skipped in --check, where
    # modprobe didn't run, so this would fail for no real reason.
    - name: tun module is present in the running kernel
      ansible.builtin.command:
        cmd: grep -qw '^tun' /proc/modules
      changed_when: false
      when: not ansible_check_mode

    - name: iscsid is enabled and running
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started
      # Under --check the package above is not really installed, so the unit
      # does not exist yet and this task would fail. That says nothing about
      # the real run.
      ignore_errors: "{{ ansible_check_mode }}"

    # At boot, iscsid logs in to every target it has a record for that is set to
    # start automatically. After the 2026-10-25 outage that put four LUNs on the
    # wrong workers: the Synology accepts one session per target, so the node
    # that actually ran the pod was refused. With startup set to manual nothing
    # logs in at boot, and the Synology CSI driver logs in on the node that needs
    # the volume.

    # New records (the driver creates them when it first attaches a LUN) take
    # their startup mode from here. Only the uncommented line is matched.
    - name: New iSCSI node records default to manual startup
      ansible.builtin.lineinfile:
        path: /etc/iscsi/iscsid.conf
        regexp: '^node\.startup\s*='
        line: node.startup = manual
      ignore_errors: "{{ ansible_check_mode }}"

    # Records that already exist keep their own copy of the setting, so the
    # config file alone doesn't fix them. Read-only, so it also runs in --check.
    - name: Count existing node records still set to start at boot
      ansible.builtin.shell: iscsiadm -m node -o show 2>/dev/null | grep -c '^node.startup = automatic' || true
      register: iscsi_auto_before
      changed_when: false
      check_mode: false

    - name: Existing node records start manually
      ansible.builtin.command:
        cmd: iscsiadm -m node -o update -n node.startup -v manual
      when: iscsi_auto_before.stdout | int > 0

    # Check the property: no record on this node is left that would log in at boot.
    - name: No node record is left set to start at boot
      ansible.builtin.shell: iscsiadm -m node -o show 2>/dev/null | grep -c '^node.startup = automatic' || true
      register: iscsi_auto_after
      changed_when: false
      failed_when: iscsi_auto_after.stdout | int != 0
      when: not ansible_check_mode

  handlers:
    - name: Restart iscsid
      ansible.builtin.systemd:
        name: iscsid
        state: restarted
